:root {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--creme); color: var(--text); }
body { font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Avenir Next", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

.kopfzeile .titel { font-weight: 800; font-size: 19px; flex: 1; }

.klein-link { display: block; margin: 18px auto 0; background: none; border: 0; color: var(--blau); font-weight: 700; text-decoration: underline; min-height: 44px; }

.brett { display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; border-radius: 6px; overflow: hidden; touch-action: manipulation; }
.feld { position: relative; border: 0; padding: 0; margin: 0; aspect-ratio: 1; display: grid; place-items: center; }
.feld.hell { background: var(--feld-hell); } .feld.dunkel { background: var(--feld-dunkel); }
.feld img { width: 88%; height: 88%; pointer-events: none; user-select: none; -webkit-user-drag: none; z-index: 2; }
.feld .ko { position: absolute; font-size: 10px; font-weight: 800; opacity: .75; pointer-events: none; z-index: 1; }

.feld.tipp::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--orange); background: #F28C2833; }

.status { text-align: center; font-weight: 750; margin: 10px 0 4px; min-height: 24px; }
.leiste { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }

.wahl { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }

.raster { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

.text p { margin: 0 0 10px; }

.kasten { background: var(--papier); border-radius: 14px; padding: 12px 14px; margin: 10px 0; box-shadow: 0 1px 4px #0001; }
.fusszeile { text-align: center; color: var(--leise); font-size: 13px; margin-top: 22px; }

@keyframes huepf { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.huepft { animation: huepf .5s ease 2; }

/* ---------- Speicher (nur auf diesem Gerät) ---------- */
const SCHLUESSEL = "otto-schach-training-v1";
function lade() { try { return JSON.parse(localStorage.getItem(SCHLUESSEL)) || {}; } catch (e) { return {}; } }
let stand = Object.assign({ sterne: {}, sammler: {}, duell: {}, partie: {} }, lade());
function speichere() { try { localStorage.setItem(SCHLUESSEL, JSON.stringify(stand)); } catch (e) {} }

/* ---------- Hilfen ---------- */
const $ = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const feldName = (x, y) => "abcdefgh"[x] + (y + 1);
const xy = (sq) => [sq.charCodeAt(0) - 97, +sq[1] - 1];
const zufall = (n) => Math.floor(Math.random() * n);
const mischen = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = zufall(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sterneText = (n) => "★".repeat(n) + "☆".repeat(3 - n);
const warte = (ms) => new Promise((r) => setTimeout(r, ms));

function kopf(titel, zurueck) {
  const k = $(`<div class="kopfzeile"><button class="zurueck">‹ Zurück</button><div class="titel"></div></div>`);
  k.querySelector(".titel").textContent = titel;
  k.querySelector("button").onclick = zurueck;
  return k;
}
function otto(text, laune = "froh", art = "") {
  const o = $(`<div class="otto"><img alt="Otto" src="otto-${laune}.png"><div class="blase ${art}"></div></div>`);
  o.querySelector(".blase").textContent = text;
  return o;
}
function setzeOtto(o, text, laune = "froh", art = "") {
  o.querySelector("img").src = `otto-${laune}.png`;
  const b = o.querySelector(".blase");
  b.className = "blase " + art;
  b.textContent = text;
  o.querySelector("img").classList.remove("huepft"); void o.offsetWidth;
  if (laune === "jubel") o.querySelector("img").classList.add("huepft");
}
function leeren(...kinder) { app.replaceChildren(...kinder); window.scrollTo(0, 0); }

/* ---------- Brett ---------- */
class Brett {
  constructor({ gedreht = false } = {}) {
    this.gedreht = gedreht;
    this.el = $(`<div class="brett-huelle"><div class="brett"></div></div>`);
    this.gitter = this.el.firstElementChild;
    this.felder = {};
    this.onFeld = () => {};
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const x = gedreht ? 7 - c : c, y = gedreht ? r : 7 - r;
      const sq = feldName(x, y);
      const f = $(`<button class="feld ${(x + y) % 2 ? "hell" : "dunkel"}" aria-label="${sq}"></button>`);
      if (c === 0) f.append($(`<span class="ko z">${y + 1}</span>`));
      if (r === 7) f.append($(`<span class="ko b">${"abcdefgh"[x]}</span>`));
      f.onclick = () => this.onFeld(sq);
      this.felder[sq] = f;
      this.gitter.append(f);
    }
  }
  stellung(map) {   // map: Feld → "wK" usw.
    for (const [sq, f] of Object.entries(this.felder)) {
      const alt = f.querySelector("img");
      const code = map[sq];
      if (!code) { if (alt) alt.remove(); f.setAttribute("aria-label", sq); continue; }
      if (alt && alt.dataset.code === code) continue;
      if (alt) alt.remove();
      const img = document.createElement("img");
      img.src = FIG[code]; img.alt = ""; img.dataset.code = code;
      f.append(img);
      f.setAttribute("aria-label", `${sq} ${NAME[code[1].toLowerCase()]}`);
    }
  }
  markiere({ auswahl = null, ziele = [], letzter = [], tipp = [], schach = null, schlagbar = [] } = {}) {
    for (const [sq, f] of Object.entries(this.felder)) {
      f.classList.toggle("auswahl", sq === auswahl);
      f.classList.toggle("letzter", letzter.includes(sq));
      f.classList.toggle("tipp", tipp.includes(sq));
      f.classList.toggle("schach", sq === schach);
      f.querySelectorAll(".punkt,.ring").forEach((e) => e.remove());
      if (ziele.includes(sq)) f.append($(schlagbar.includes(sq) ? `<span class="ring"></span>` : `<span class="punkt"></span>`));
    }
